<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Proposal 💗</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Noto Sans Myanmar", "Myanmar Text", "Segoe UI", sans-serif;
    background-color: #f8dce5;
    background-image:
      linear-gradient(rgba(255,255,255,.28) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px),
      linear-gradient(rgba(196,135,157,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,135,157,.10) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 5px 5px, 5px 5px;
  }

  .card {
    position: relative;
    width: min(88vw, 360px);
    min-height: 300px;
    padding: 28px 18px 22px;
    border-radius: 22px;
    background: rgba(255, 253, 254, .94);
    box-shadow: 0 12px 30px rgba(123, 73, 91, .13);
    text-align: center;
    animation: cardIn .55s ease both;
  }

  .cute-message {
    width: min(100%, 300px);
    min-height: 125px;
    margin: 0 auto 12px;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;
    border-radius: 28px;
    background: #fff0f6;
    border: 2px dashed #e58bb2;
    color: #b83d70;
    font-size: clamp(21px, 5.8vw, 27px);
    line-height: 1.55;
    font-weight: 800;
    box-shadow: 0 7px 18px rgba(184, 61, 112, .08);
    animation: cuteFloat 2.2s ease-in-out infinite;
  }

  .cute-message .sparkle {
    font-size: 21px;
  }

  .cute-message .heart-mini {
    font-size: 22px;
  }

  h2 {
    margin: 6px 0 18px;
    color: #b83d70;
    font-size: clamp(18px, 5vw, 23px);
    line-height: 1.65;
    font-weight: 700;
  }

  .btn-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    min-height: 48px;
  }

  button {
    border: 0;
    font: inherit;
    font-size: 16px;
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  button:active {
    transform: scale(.94);
  }

  #yesBtn {
    padding: 11px 24px;
    color: #fff;
    background: #e55b9d;
    box-shadow: 0 5px 12px rgba(229, 91, 157, .25);
  }

  #noBtn {
    position: relative;
    padding: 7px 2px;
    color: #555;
    background: transparent;
  }

  #noBtn:hover {
    color: #b83d70;
  }

  .letter {
    display: none;
    position: relative;
    padding: 23px 18px 20px;
    border-radius: 20px;
    background: rgba(255, 253, 254, .96);
    box-shadow: 0 12px 30px rgba(123, 73, 91, .13);
    text-align: center;
    animation: letterIn .65s cubic-bezier(.2,.8,.2,1) both;
  }

  .letter .heart {
    display: block;
    margin: -5px auto 5px;
    color: #b83d70;
    font-size: 25px;
  }

  .letter h3 {
    margin: 0 0 13px;
    color: #8f345d;
    font-size: 21px;
  }

  .letter p {
    margin: 0;
    color: #555;
    font-size: 15px;
    line-height: 2;
  }

  .letter .small-heart {
    color: #e55b9d;
  }

  .hidden {
    display: none !important;
  }

  @keyframes cuteFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(.94) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes letterIn {
    from { opacity: 0; transform: scale(.9) translateY(18px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-height: 620px) {
    .card {
      min-height: 0;
      padding-top: 15px;
      padding-bottom: 15px;
    }
    .cute-message {
      min-height: 95px;
      padding: 16px 12px;
    }
    h2 { margin-bottom: 10px; }
  }
</style>
</head>

<body>
  <main class="card" id="mainCard">

    <section id="proposal">
      <div class="cute-message" aria-label="ချစ်စရာစာသား">
        <span class="sparkle">✦</span>
        <span>ထက် ခန့်ကို ပြန်ချစ်နော်</span>
        <span class="heart-mini">♥</span>
      </div>

      <h2>ခန့်ရဲ့အမျိုးသမီးလေး ဖစ်ပေးနိုင်မလား ထက်?</h2>

      <div class="btn-container">
        <button id="yesBtn" type="button" onclick="acceptProposal()">♥ Yes</button>
        <button id="noBtn" type="button" onclick="moveButton()">× No 🥺</button>
      </div>
    </section>

    <section class="letter" id="letterBox">
      <span class="heart">♥</span>
      <h3>Confession Letter 💌</h3>
      <p>
        ထက်ကို ခန့်အများကြီး ချစ်တယ်နော်။<br>
        ခန့်ဘေးနားမှာ အမြဲရှိပေးပါ။<br><br>
        မင်းကို ကိုယ်ချစ်တယ်။<br><br>
        ဒီအချစ်လေးကို ကိုယ့်ဘဝရဲ့ ရင်ထဲမှာထားပြီး
        အမြဲချစ်နေမယ် <span class="small-heart">♥</span>
      </p>
    </section>

  </main>

<script>
  const noBtn = document.getElementById("noBtn");
  const mainCard = document.getElementById("mainCard");
  let moved = false;

  function moveButton() {
    // No ကို ဘယ်နှစ်ခါနှိပ်နှိပ် မပျောက်ဘဲ screen အတွင်းမှာပဲ အမြဲရွှေ့မယ်။
    moved = true;
    noBtn.style.position = "fixed";
    noBtn.style.display = "block";
    noBtn.style.visibility = "visible";
    noBtn.style.zIndex = "9999";

    const padding = 18;
    const buttonWidth = noBtn.offsetWidth || 80;
    const buttonHeight = noBtn.offsetHeight || 42;

    // Button တစ်ခုလုံး screen ထဲမှာ ကျန်အောင် boundary သတ်မှတ်ထားတယ်။
    const maxX = Math.max(padding, window.innerWidth - buttonWidth - padding);
    const maxY = Math.max(padding, window.innerHeight - buttonHeight - padding);

    const x = padding + Math.random() * Math.max(0, maxX - padding);
    const y = padding + Math.random() * Math.max(0, maxY - padding);

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
  }

  function acceptProposal() {
    document.getElementById("proposal").classList.add("hidden");
    document.getElementById("letterBox").style.display = "block";
    noBtn.style.display = "none";
    mainCard.style.background = "transparent";
    mainCard.style.boxShadow = "none";
    mainCard.style.padding = "0";
  }

  // Screen size ပြောင်းရင် button ပျောက်မသွားအောင် နေရာအသစ်တစ်ခုမှာ ပြန်ထားမယ်။
  window.addEventListener("resize", () => {
    if (moved && noBtn.style.display !== "none") {
      moveButton();
    }
  });
</script>
</body>
</html>
